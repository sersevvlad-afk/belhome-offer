<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BELHOME — персональное предложение</title>
<meta name="theme-color" content="#0c0d0e">
<style>
:root{--bg:#0b0d0e;--panel:#121516;--line:#2b3032;--text:#f4f1ea;--muted:#aaa79f;--accent:#df4435;--soft:#181c1d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1160px;margin:auto;padding:0 24px}.head{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;background:rgba(11,13,14,.92);backdrop-filter:blur(14px);z-index:30}.brand{font-size:22px;font-weight:950;letter-spacing:.08em}.brand small{font-size:10px;display:block;letter-spacing:.14em;color:var(--muted);margin-top:2px}.head .personal{font-size:12px;color:var(--muted);text-align:right}.hero{min-height:680px;background:center/cover no-repeat;position:relative;display:flex;align-items:flex-end}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,6,6,.96),rgba(5,6,6,.76) 46%,rgba(5,6,6,.1) 80%),linear-gradient(0deg,rgba(5,6,6,.75),transparent 48%)}.hero-in{position:relative;z-index:2;padding:95px 0 70px;max-width:830px}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#d4d0c8;margin-bottom:17px}.hero h1{font-size:clamp(44px,7vw,86px);line-height:.92;letter-spacing:-.045em;text-transform:uppercase;margin:0 0 24px}.meta{display:flex;gap:18px;flex-wrap:wrap;color:#d6d2c9}.price-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:30px}.price{font-size:clamp(36px,5vw,56px);font-weight:950}.old{font-size:20px;color:#8f928f;text-decoration:line-through;padding-bottom:7px}.tag{background:var(--accent);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:850;margin-bottom:5px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:27px}.btn{border:1px solid rgba(255,255,255,.18);padding:13px 17px;border-radius:10px;font-weight:850;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--accent);border-color:var(--accent)}section{padding:82px 0;border-bottom:1px solid rgba(255,255,255,.08)}.title{font-size:clamp(34px,5vw,58px);line-height:.98;letter-spacing:-.035em;text-transform:uppercase;margin:0 0 14px}.sub{color:var(--muted);line-height:1.6;max-width:790px}.plan-grid{display:grid;grid-template-columns:1.5fr .65fr;gap:30px;margin-top:30px}.media{border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;background:#181b1c;min-height:420px;display:flex;align-items:center;justify-content:center}.media img{display:block;max-width:100%;max-height:720px}.specs{display:grid;gap:4px}.spec{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08)}.spec span{color:var(--muted)}.calc{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;margin-top:28px}.crow{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08)}.crow:last-child{border:0}.crow strong{text-align:right}.total{font-size:30px;font-weight:950}.discount{color:#8ad19a}.gift{margin-top:18px;padding:18px;border-radius:14px;border:1px solid rgba(223,68,53,.45);background:rgba(223,68,53,.08)}.tech-layout{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;margin-top:30px}.tech-img{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}.tech-img img{width:100%;display:block}.techs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tech{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:17px;min-height:135px}.tech b{font-size:19px;display:block;margin-bottom:7px}.tech span{font-size:12px;line-height:1.45;color:var(--muted)}.numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px}.num{padding:18px;background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:14px}.num b{font-size:30px;display:block}.num span{font-size:12px;color:var(--muted)}.factory{margin-top:28px;border-radius:16px;overflow:hidden;height:440px;background:center/cover no-repeat;border:1px solid rgba(255,255,255,.08)}.footer{padding:90px 0 100px}.footer h2{font-size:clamp(44px,7vw,84px);line-height:.92;letter-spacing:-.045em;text-transform:uppercase;margin:0 0 26px;max-width:880px}.note{font-size:11px;color:#7b807d;margin-top:16px}.empty{max-width:720px;margin:80px auto;padding:26px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
@media(max-width:820px){.plan-grid,.tech-layout{grid-template-columns:1fr}.numbers{grid-template-columns:1fr 1fr}.hero{min-height:610px}.hero h1{font-size:48px}.factory{height:330px}}
@media(max-width:520px){.wrap{padding:0 16px}.head{height:64px}.personal{display:none}.hero{min-height:570px}.hero-in{padding:70px 0 42px}.hero h1{font-size:40px}.price{font-size:36px}.techs,.numbers{grid-template-columns:1fr}.title{font-size:34px}.footer h2{font-size:46px}.actions .btn{width:100%}}
</style>
</head>
<body><div id="app"></div>
<script>
const demo={client:'Иван',project:'BELHOME 72',area:'72',terrace:'24',bedrooms:'2',price:3800000,oldPrice:4100000,deadline:'25 сентября',gift:'Хозблок стоимостью 130 000 ₽ — в подарок',hero:'assets/house.jpg',plan:'assets/plan-demo.svg',factory:'assets/factory.jpg',wall:'assets/wall.jpg',manager:'Александр',phone:'+79990000000',whatsapp:'+79990000000',years:'5 лет',objects:'250+',production:'1000 м²',warranty:'10 лет',calc:[['Дом BELHOME 72',3570000],['Терраса 24 м²',240000],['Доставка',130000],['Скидка BELHOME',-140000]],note:'Персональные условия рассчитаны для выбранной комплектации.'};
function decodeOffer(){try{let h=location.hash.match(/(?:^#|&)o=([^&]+)/);if(!h)return null;let s=h[1].replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';let bin=atob(s),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder().decode(bytes));}catch(e){return null}}
const o=Object.assign({},demo,window.__BELHOME_OFFER__||{},decodeOffer()||{});o.calc=Array.isArray(o.calc)?o.calc:demo.calc;
const money=n=>new Intl.NumberFormat('ru-RU').format(Number(n||0))+' ₽';
const tel=(o.phone||'').replace(/[^+\d]/g,''); const wa=(o.whatsapp||o.phone||'').replace(/\D/g,'');
const calcTotal=o.calc.reduce((a,r)=>a+Number(r[1]||0),0);
document.title=`${o.client}, ваш дом ${o.project} — BELHOME`;
document.getElementById('app').innerHTML=`
<header class="head"><div class="wrap" style="width:100%;display:flex;align-items:center;justify-content:space-between"><div class="brand">BELHOME<small>ПРОИЗВОДСТВО МОДУЛЬНЫХ ДОМОВ</small></div><div class="personal">Персональное предложение<br><b>${o.client}</b></div></div></header>
<section class="hero" style="background-image:url('${o.hero||'assets/house.jpg'}')"><div class="wrap" style="width:100%"><div class="hero-in"><div class="eyebrow">${o.client}, это ваш персональный расчёт</div><h1>${o.project}</h1><div class="meta"><b>${o.area} м² дом</b><span>+ ${o.terrace} м² терраса</span><span>${o.bedrooms} спальни</span></div><div class="price-row"><div class="price">${money(o.price)}</div>${o.oldPrice?`<div class="old">${money(o.oldPrice)}</div>`:''}<div class="tag">до ${o.deadline}</div></div><div class="actions"><a class="btn primary" href="#plan">Посмотреть планировку</a><a class="btn" href="#calc">Расчёт стоимости</a></div></div></div></section>
<section id="plan"><div class="wrap"><h2 class="title">Ваш дом. Без лишних метров.</h2><p class="sub">Планировка и параметры конкретного предложения. Здесь клиент сразу видит, за что платит и как будет устроен дом.</p><div class="plan-grid"><div class="media"><img src="${o.plan||'assets/plan-demo.svg'}" alt="Планировка"></div><div class="specs"><div class="spec"><span>Дом</span><b>${o.area} м²</b></div><div class="spec"><span>Терраса</span><b>${o.terrace} м²</b></div><div class="spec"><span>Спальни</span><b>${o.bedrooms}</b></div><div class="spec"><span>Проект</span><b>${o.project}</b></div><div class="gift"><b>Персональное условие</b><div style="margin-top:7px;color:#d6d1c8">${o.gift||'Уточните подарок у менеджера'}</div></div></div></div></div></section>
<section id="calc"><div class="wrap"><h2 class="title">Прозрачный расчёт.</h2><p class="sub">Не одна непонятная итоговая цифра: основные позиции предложения вынесены отдельно.</p><div class="calc">${o.calc.map(r=>`<div class="crow"><span>${r[0]}</span><strong class="${Number(r[1])<0?'discount':''}">${Number(r[1])<0?'− '+money(Math.abs(r[1])):money(r[1])}</strong></div>`).join('')}<div class="crow"><span><b>ИТОГО</b></span><strong class="total">${money(o.price||calcTotal)}</strong></div></div><div class="note">${o.note||''}</div></div></section>
<section><div class="wrap"><h2 class="title">С фотографии все дома похожи. Разница скрыта внутри.</h2><p class="sub">BELHOME делает ставку не на количество обещаний, а на конструкцию, контролируемые производственные процессы и возможность показать клиенту дом до закрытия скрытых узлов.</p><div class="tech-layout"><div class="tech-img"><img src="${o.wall||'assets/wall.jpg'}" alt="Конструкция стены"></div><div class="techs"><div class="tech"><b>Сухая древесина</b><span>Контроль материала до того, как он становится частью конструкции.</span></div><div class="tech"><b>Герметичный контур</b><span>Внимание к примыканиям, плёнкам и скрытым узлам.</span></div><div class="tech"><b>Паро- и ветрозащита</b><span>Каждый слой выполняет отдельную функцию в конструкции стены.</span></div><div class="tech"><b>Заводская сборка</b><span>Большая часть работ выполняется под крышей, а не на открытом участке.</span></div></div></div></div></section>
<section><div class="wrap"><h2 class="title">Не стройплощадка. Производство.</h2><p class="sub">Клиент может приехать и увидеть, как собираются дома, какие материалы используются и что скрывается под чистовой отделкой.</p><div class="numbers"><div class="num"><b>${o.years}</b><span>на рынке</span></div><div class="num"><b>${o.objects}</b><span>реализованных объектов</span></div><div class="num"><b>${o.production}</b><span>производства</span></div><div class="num"><b>${o.warranty}</b><span>гарантия</span></div></div><div class="factory" style="background-image:url('${o.factory||'assets/factory.jpg'}')"></div></div></section>
<footer class="footer"><div class="wrap"><h2>Мы не обещаем. Мы показываем.</h2><p class="sub">Приезжайте на производство BELHOME и посмотрите, как строится ваш будущий дом.</p><div class="actions">${tel?`<a class="btn primary" href="tel:${tel}">Позвонить ${o.manager||'менеджеру'}</a>`:''}${wa?`<a class="btn" target="_blank" href="https://wa.me/${wa}">WhatsApp</a>`:''}</div><div class="note">Предложение не является публичной офертой. Финальная комплектация и условия фиксируются в договоре.</div></div></footer>`;
</script></body></html>
